<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">organization-agent-swarm</title>
<desc id="d">Three panels. 1, the repo's kickoff prompt: Act as the Worldwide Marketing Orchestrator, then Task: [PASTE THE OBJECTIVE]. 2, the preferred path from team/operating-model.md: User, then Worldwide Orchestrator, Division Lead(s), Specialist(s), Independent analytics review, and Human approval. 3, real output of python3 scripts/validate_swarm.py: VALID, Agents: 20, Hierarchy: 1 orchestrator, 3 leads, 16 specialists, Adapters: 80 platform-specific agent files, Platforms: Claude Code, Codex, Cursor, OpenCode.</desc>
<style>
.serif{font-family:Georgia,"Times New Roman",serif}
.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.lab{font-size:10px;letter-spacing:1.8px;font-weight:600}
.cap{font-size:11.5px;fill:#8b9096}
.hl{fill:none;stroke-width:1.5;opacity:0}
.h1{animation:h1 12s infinite}
.h2{animation:h2 12s infinite}
.h3{animation:h3 12s infinite}
.r1{animation:r1 12s infinite}
.r2{animation:r2 12s infinite}
.rb{animation:rb 12s infinite}
.rc{animation:rc 12s infinite}
.rd{animation:rd 12s infinite}
.re{animation:re 12s infinite}
.rf{animation:rf 12s infinite}
.rg{animation:rg 12s infinite}
.rh{animation:rh 12s infinite}
.ri{animation:ri 12s infinite}
.rj{animation:rj 12s infinite}
.rk{animation:rk 12s infinite}
@keyframes h1{0%,16.7%{opacity:0}18.7%,42.4%{opacity:1}44.1%,100%{opacity:0}}
@keyframes h2{0%,16.7%,18.7%,44.1%{opacity:0}45.8%,67.8%{opacity:1}69.5%,100%{opacity:0}}
@keyframes h3{0%,16.7%,18.7%,69.5%{opacity:0}71.2%,94.9%{opacity:1}96.6%,100%{opacity:0}}
@keyframes r1{0%,16.7%{opacity:1}18.7%,20.4%{opacity:0}22.1%,100%{opacity:1}}
@keyframes r2{0%,16.7%{opacity:1}18.7%,28.9%{opacity:0}30.6%,100%{opacity:1}}
@keyframes rb{0%,16.7%{opacity:1}18.7%,45%{opacity:0}46.6%,100%{opacity:1}}
@keyframes rc{0%,16.7%{opacity:1}18.7%,48.3%{opacity:0}50%,100%{opacity:1}}
@keyframes rd{0%,16.7%{opacity:1}18.7%,51.7%{opacity:0}53.4%,100%{opacity:1}}
@keyframes re{0%,16.7%{opacity:1}18.7%,55.1%{opacity:0}56.8%,100%{opacity:1}}
@keyframes rf{0%,16.7%{opacity:1}18.7%,58.5%{opacity:0}60.2%,100%{opacity:1}}
@keyframes rg{0%,16.7%{opacity:1}18.7%,61.9%{opacity:0}63.6%,100%{opacity:1}}
@keyframes rh{0%,16.7%{opacity:1}18.7%,72.1%{opacity:0}73.7%,100%{opacity:1}}
@keyframes ri{0%,16.7%{opacity:1}18.7%,77.1%{opacity:0}78.8%,100%{opacity:1}}
@keyframes rj{0%,16.7%{opacity:1}18.7%,82.2%{opacity:0}83.9%,100%{opacity:1}}
@keyframes rk{0%,16.7%{opacity:1}18.7%,88.1%{opacity:0}89.8%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="300" fill="#141618"/>

<text x="32" y="50" class="serif" font-size="28" fill="#e4dfd4">organization-agent-swarm</text>
<text x="377" y="50" class="sans" font-size="13.5" fill="#a9adb2">An independent, portable 20-agent team</text>

<g>
<text x="32" y="88" class="sans lab" fill="#a39bbd">1 · ONE BIG ASK</text>
<rect x="32" y="98" width="232" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h1" x="32" y="98" width="232" height="152" rx="3" stroke="#a39bbd"/>
<text x="44" y="115" class="mono" font-size="10" fill="#8b9096">examples/prompts.md · kickoff</text>
<line x1="33" y1="123" x2="263" y2="123" stroke="#2e3237"/>
<g class="r1"><rect x="44" y="133" width="208" height="110" rx="3" fill="#1f2225" stroke="#353a40"/><text x="54" y="151" class="sans" font-size="10.5" fill="#e4dfd4">Act as the Worldwide Marketing</text><text x="54" y="165" class="sans" font-size="10.5" fill="#e4dfd4">Orchestrator.</text><g fill="#3d4248"><rect x="54" y="174" width="180" height="3"/><rect x="54" y="181" width="150" height="3"/></g></g>
<g class="r2"><text x="54" y="201" class="mono" font-size="10" fill="#a9adb2">Task:</text><text x="54" y="217" class="mono" font-size="10" fill="#c8963e">[PASTE THE OBJECTIVE]</text><g fill="#3d4248"><rect x="54" y="228" width="168" height="3"/></g></g>
<text x="32" y="272" class="sans cap">One agent tends to do too much at once.</text>
</g>

<g>
<text x="284" y="88" class="sans lab" fill="#c8963e">2 · ROUTED, THEN APPROVED</text>
<rect x="284" y="98" width="252" height="152" rx="3" fill="#17191c" stroke="#2e3237"/>
<rect class="hl h2" x="284" y="98" width="252" height="152" rx="3" stroke="#c8963e"/>
<text x="296" y="115" class="mono" font-size="10" fill="#8b9096">team/operating-model.md</text>
<line x1="285" y1="123" x2="535" y2="123" stroke="#2e3237"/>
<g class="rb"><text x="296" y="143" class="mono" font-size="10" fill="#e4dfd4">User</text></g>
<g class="rc"><text x="296" y="159" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">  -&gt; Worldwide Orchestrator</text></g>
<g class="rd"><text x="296" y="175" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">      -&gt; Division Lead(s)</text></g>
<g class="re"><text x="296" y="191" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">          -&gt; Specialist(s)</text></g>
<g class="rf"><text x="296" y="207" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">      -&gt; Independent analytics review</text></g>
<g class="rg"><text x="296" y="223" class="mono" font-size="10" fill="#93ad8c" xml:space="preserve">  -&gt; Human approval</text></g>
<text x="284" y="272" class="sans cap">Work is routed, reviewed, then approved.</text>
</g>

<g>
<text x="556" y="88" class="sans lab" fill="#93ad8c">3 · ONE ROSTER, FOUR CLIENTS</text>
<rect x="556" y="98" width="312" height="152" rx="3" fill="#17191c" stroke="#2e3237"/>
<rect class="hl h3" x="556" y="98" width="312" height="152" rx="3" stroke="#93ad8c"/>
<text x="568" y="118" class="mono" font-size="10" fill="#8b9096">$ python3 scripts/validate_swarm.py</text>
<g class="rh"><text x="568" y="140" class="mono" font-size="10" fill="#93ad8c" font-weight="700">VALID</text><text x="568" y="156" class="mono" font-size="10" fill="#e4dfd4">Agents: 20</text></g>
<g class="ri"><text x="568" y="172" class="mono" font-size="10" fill="#e4dfd4">Hierarchy: 1 orchestrator, 3 leads,</text><text x="568" y="186" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">           16 specialists</text></g>
<g class="rj"><text x="568" y="204" class="mono" font-size="10" fill="#e4dfd4">Adapters: 80 platform-specific agent files</text><text x="568" y="220" class="mono" font-size="10" fill="#e4dfd4">Platforms: Claude Code, Codex, Cursor, OpenCode</text></g>
<rect class="rk" x="564" y="194" width="262" height="14" fill="none" stroke="#93ad8c" stroke-dasharray="3 2"/>
<text x="556" y="272" class="sans" font-size="11.5" fill="#93ad8c">One roster, generated for four clients.</text>
</g>
</svg>
